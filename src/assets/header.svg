<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0fb"/>
      <stop offset="0.55" stop-color="#e4e7f8"/>
      <stop offset="1" stop-color="#dfe0f2"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5e6ad2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5e6ad2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b93e6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b93e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b98fd6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#b98fd6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#5e6ad2" fill-opacity="0.10"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#dots)"/>

  <g filter="url(#soft)">
    <ellipse cx="180" cy="120" rx="520" ry="420" fill="url(#g1)"/>
    <ellipse cx="1360" cy="470" rx="560" ry="440" fill="url(#g2)"/>
    <ellipse cx="820" cy="-60" rx="420" ry="340" fill="url(#g3)"/>
    <ellipse cx="1180" cy="90" rx="300" ry="260" fill="url(#g1)"/>
  </g>

  <g stroke="#5e6ad2" stroke-opacity="0.14" fill="none" stroke-width="1.5">
    <path d="M -50 470 C 300 360, 620 540, 900 420 S 1400 300, 1680 400"/>
    <path d="M -50 520 C 320 430, 640 590, 940 470 S 1420 360, 1680 450"/>
  </g>

  <rect width="1600" height="600" fill="#fbfbfc" fill-opacity="0.04"/>
</svg>
